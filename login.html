<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | T-Choob</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-logo">T-Choob</div>
        <h1 class="auth-title">ورود به حساب</h1>
        <div id="message-box" class="message-box hidden"></div>
        <div class="auth-field">
            <input id="login-email" type="email" placeholder="ایمیل خود را وارد کنید" class="auth-input" autocomplete="email">
        </div>
        <div class="auth-field">
            <input id="login-password" type="password" placeholder="رمز عبور" class="auth-input password-input" autocomplete="current-password">
            <button type="button" onclick="togglePassword()" class="password-toggle" aria-label="نمایش رمز">◉</button>
        </div>
        <button id="login-btn" onclick="handleLogin()" class="auth-btn">ورود</button>
        <a href="./signup.html" class="auth-link">ساخت حساب جدید</a>
        <a href="./index.html" class="auth-link auth-back">بازگشت به فروشگاه</a>
    </main>
    <script>
        function togglePassword() {
            const input = document.getElementById("login-password");
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>
    <script src="auth.js"></script>
</body>
</html>
