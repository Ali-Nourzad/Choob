<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>ورود به حساب | T-Choob</title>

	<link rel="icon" href="favicon.ico">
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<div class="auth-page">

		<div class="auth-container">

			<div class="auth-card">

				<div class="auth-header">

					<a
						href="index.html"
						class="auth-logo">
						T
					</a>

					<h1>
						ورود به حساب
					</h1>

					<p>
						به T-Choob خوش آمدید
					</p>

				</div>


				<form
					id="login-form"
					class="auth-form">

					<div class="auth-field">

						<label for="login-email">
							ایمیل
						</label>

						<input
							type="email"
							id="login-email"
							placeholder="example@email.com"
							autocomplete="email"
							required>

					</div>


					<div class="auth-field">

						<label for="login-password">
							رمز عبور
						</label>

						<div class="auth-password-wrapper">

							<input
								type="password"
								id="login-password"
								placeholder="رمز عبور خود را وارد کنید"
								autocomplete="current-password"
								required>

							<button
								type="button"
								id="password-toggle"
								class="auth-password-toggle">
								نمایش
							</button>

						</div>

					</div>


					<div
						id="login-message"
						class="auth-message">
					</div>


					<button
						type="submit"
						id="login-btn"
						class="auth-submit">
						ورود
					</button>

				</form>


				<div class="auth-divider">
					<span>
						یا
					</span>
				</div>


				<div class="auth-register">

					<span>
						حساب کاربری ندارید؟
					</span>

					<a href="signup.html">
						ساخت حساب جدید
					</a>

				</div>


				<a
					href="index.html"
					class="auth-back">
					بازگشت به فروشگاه
				</a>

			</div>

		</div>

	</div>


	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<script src="auth.js"></script>


	<script>
		const loginForm =
			document.getElementById(
				"login-form"
			);


		if (loginForm) {

			loginForm.addEventListener(
				"submit",
				function (event) {

					event.preventDefault();

					handleLogin();

				}
			);

		}


		const passwordInput =
			document.getElementById(
				"login-password"
			);


		const passwordToggle =
			document.getElementById(
				"password-toggle"
			);


		if (
			passwordToggle &&
			passwordInput
		) {

			passwordToggle.addEventListener(
				"click",
				function () {

					if (
						passwordInput.type ===
						"password"
					) {

						passwordInput.type =
							"text";

						passwordToggle.textContent =
							"مخفی";

					} else {

						passwordInput.type =
							"password";

						passwordToggle.textContent =
							"نمایش";

					}

				}
			);

		}
	</script>

</body>

</html>
