<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تغییر رمز عبور | T-Choob</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-logo">T-Choob</div>
        <h1 class="auth-title">تغییر رمز عبور</h1>
        <p style="margin: -12px 0 22px; color: var(--muted); text-align: center;">یک رمز عبور جدید انتخاب کنید.</p>
        <div class="auth-field">
            <input id="new-password" type="password" placeholder="رمز عبور جدید" class="auth-input password-input" autocomplete="new-password">
            <button type="button" onclick="togglePassword()" class="password-toggle" aria-label="نمایش رمز">◉</button>
        </div>
        <div class="password-strength">
            <div class="password-bar-bg">
                <div id="password-bar" class="password-bar"></div>
            </div>
            <p id="password-strength" class="strength-text">قدرت رمز عبور</p>
        </div>
        <button id="save-btn" onclick="updatePassword()" class="auth-btn">ذخیره تغییرات</button>
        <div style="display: flex; justify-content: space-between; gap: 15px; margin-top: 18px;">
            <a href="login.html" class="auth-link" style="margin-top: 0;">بازگشت به ورود</a>
            <a href="index.html" class="auth-link" style="margin-top: 0;">فروشگاه</a>
        </div>
    </main>
    <script>
        const shopDB = window.supabase.createClient(
            "https://rlduutynqgevgzmayeit.supabase.co",
            "sb_publishable_QQKsRmCxqZNX1dZW7bjAmA_xypPHAjD"
        );

        const passwordInput = document.getElementById("new-password");

        passwordInput.addEventListener("input", checkStrength);

        function togglePassword() {
            passwordInput.type = passwordInput.type === "password" ? "text" : "password";
        }

        function checkStrength() {
            const value = passwordInput.value;
            const bar = document.getElementById("password-bar");
            const text = document.getElementById("password-strength");
            let score = 0;

            if (value.length >= 8) score++;
            if (/[A-Z]/.test(value)) score++;
            if (/[0-9]/.test(value)) score++;
            if (/[!@#$%^&*]/.test(value)) score++;

            if (score === 0) {
                bar.style.width = "0%";
                text.innerText = "قدرت رمز عبور";
                return;
            }

            if (score === 1) {
                bar.style.width = "25%";
                text.innerText = "ضعیف";
                return;
            }

            if (score === 2) {
                bar.style.width = "50%";
                text.innerText = "متوسط";
                return;
            }

            if (score === 3) {
                bar.style.width = "75%";
                text.innerText = "خوب";
                return;
            }

            bar.style.width = "100%";
            text.innerText = "قوی";
        }

        async function updatePassword() {
            const password = passwordInput.value.trim();

            if (password.length < 6) {
                alert("رمز عبور باید حداقل ۶ کاراکتر باشد.");
                return;
            }

            const btn = document.getElementById("save-btn");
            btn.disabled = true;
            btn.innerText = "در حال ذخیره...";

            const { error } = await shopDB.auth.updateUser({ password });

            btn.disabled = false;
            btn.innerText = "ذخیره تغییرات";

            if (error) {
                alert(error.message);
                return;
            }

            alert("رمز عبور با موفقیت تغییر کرد.");
            location.href = "login.html";
        }
    </script>
</body>
</html>
