<!DOCTYPE html>

<html lang="fa" dir="rtl">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>تغییر رمز عبور | T-Choob</title>
        <link rel="icon" type="image/png" href="favicon.ico">
        <script src="https://cdn.tailwindcss.com"></script>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <link rel="icon" href="favicon.ico">

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');

            body {

                font-family: 'Vazirmatn', sans-serif;

            }

        </style>

    </head>

    <body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

        <div class="w-full max-w-md">

            <div class="bg-white rounded-3xl shadow-xl p-8">

                <div class="text-center mb-8">

                    <div class="text-6xl mb-4">

                        🔐

                    </div>

                    <h1 class="text-3xl font-bold text-gray-800">

                        تغییر رمز عبور

                    </h1>

                    <p class="text-gray-500 mt-3">

                        یک رمز عبور جدید انتخاب کنید.

                    </p>

                </div>


                <div class="space-y-5">


                    <div class="relative">

                        <input id="new-password" type="password" placeholder="رمز عبور جدید" class="w-full border border-gray-300 rounded-2xl p-4 pl-16 outline-none focus:ring-2 focus:ring-blue-500" />


                        <button type="button" onclick="togglePassword()" class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">

                            👁️

                        </button>

                    </div>


                    <div>

                        <div class="w-full bg-gray-200 h-2 rounded-full">

                            <div id="password-bar" class="h-2 rounded-full transition-all" style="width:0%">

                            </div>

                        </div>


                        <p id="password-strength" class="text-sm mt-2 text-gray-500">

                            قدرت رمز عبور

                        </p>

                    </div>


                    <button id="save-btn" onclick="updatePassword()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold transition">

                        ذخیره تغییرات

                    </button>


                    <div class="flex justify-between text-sm">


                        <a href="login.html" class="text-blue-600 hover:underline">

                            بازگشت به ورود

                        </a>


                        <a href="index.html" class="text-blue-600 hover:underline">

                            بازگشت به فروشگاه

                        </a>


                    </div>

                </div>

            </div>

        </div>

        <script>
            const shopDB =

                window.supabase.createClient(

                    'https://rlduutynqgevgzmayeit.supabase.co',

                    'sb_publishable_QQKsRmCxqZNX1dZW7bjAmA_xypPHAjD'

                );

            const passwordInput =

                document.getElementById(

                    'new-password'

                );

            passwordInput.addEventListener(

                'input',

                checkStrength

            );

            function togglePassword() {

                passwordInput.type =

                    passwordInput.type === 'password'

                    ?
                    'text'

                    :
                    'password';

            }

            function checkStrength() {

                const value =

                    passwordInput.value;

                const bar =

                    document.getElementById(

                        'password-bar'

                    );

                const text =

                    document.getElementById(

                        'password-strength'

                    );

                let score = 0;

                if (value.length >= 8) score++;

                if (/[A-Z]/.test(value)) score++;

                if (/[0-9]/.test(value)) score++;

                if (/[!@#$%^&*]/.test(value)) score++;

                if (score === 0) {

                    bar.style.width = '0%';

                    bar.className = 'h-2 rounded-full';

                    text.innerText = 'قدرت رمز عبور';

                    return;

                }

                if (score === 1) {

                    bar.style.width = '25%';

                    bar.className = 'h-2 rounded-full bg-red-500';

                    text.innerText = 'ضعیف';

                }

                if (score === 2) {

                    bar.style.width = '50%';

                    bar.className = 'h-2 rounded-full bg-orange-500';

                    text.innerText = 'متوسط';

                }

                if (score === 3) {

                    bar.style.width = '75%';

                    bar.className = 'h-2 rounded-full bg-blue-500';

                    text.innerText = 'خوب';

                }

                if (score === 4) {

                    bar.style.width = '100%';

                    bar.className = 'h-2 rounded-full bg-green-500';

                    text.innerText = 'قوی';

                }

            }

            async function updatePassword() {

                const password =

                    passwordInput.value.trim();

                if (password.length < 6) {

                    return alert(

                        'رمز عبور باید حداقل ۶ کاراکتر باشد.'

                    );

                }

                const btn =

                    document.getElementById(

                        'save-btn'

                    );

                btn.disabled = true;

                btn.innerText =

                    'در حال ذخیره...';

                const {
                    error
                } =

                await shopDB.auth.updateUser({

                    password

                });

                btn.disabled = false;

                btn.innerText =

                    'ذخیره تغییرات';

                if (error) {

                    return alert(

                        error.message

                    );

                }

                alert(

                    'رمز عبور با موفقیت تغییر کرد.'

                );

                location.href = 'login.html';

            }

        </script>

    </body>

</html>
