<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>ثبت نام | T-Choob</title>

	<link rel="icon" href="favicon.ico">
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<div class="signup-page">

		<div class="signup-container">

			<div class="signup-card">

				<div class="signup-header">

					<div class="signup-logo">
						T
					</div>

					<h1>
						ایجاد حساب کاربری
					</h1>

					<p>
						برای ثبت سفارش و مدیریت حساب خود ثبت نام کنید
					</p>

				</div>


				<form
					id="signup-form"
					class="signup-form">


					<div class="form-group">

						<label for="first-name">
							نام
						</label>

						<input
							type="text"
							id="first-name"
							name="first_name"
							placeholder="نام خود را وارد کنید"
							autocomplete="given-name"
							required>

					</div>


					<div class="form-group">

						<label for="last-name">
							نام خانوادگی
						</label>

						<input
							type="text"
							id="last-name"
							name="last_name"
							placeholder="نام خانوادگی خود را وارد کنید"
							autocomplete="family-name"
							required>

					</div>


					<div class="form-group">

						<label for="signup-username">
							نام کاربری
						</label>

						<input
							type="text"
							id="signup-username"
							name="username"
							placeholder="نام کاربری"
							autocomplete="username"
							required>

					</div>


					<div class="form-group">

						<label for="signup-phone">
							شماره تلفن
						</label>

						<input
							type="tel"
							id="signup-phone"
							name="phone"
							placeholder="مثلاً 09123456789"
							autocomplete="tel"
							required>

					</div>


					<div class="form-group">

						<label for="gender">
							جنسیت
						</label>

						<select
							id="gender"
							name="gender"
							required>

							<option value="">
								انتخاب کنید
							</option>

							<option value="male">
								مرد
							</option>

							<option value="female">
								زن
							</option>

							<option value="other">
								سایر
							</option>

						</select>

					</div>


					<div class="form-group">

						<label for="signup-email">
							ایمیل
						</label>

						<input
							type="email"
							id="signup-email"
							name="email"
							placeholder="example@email.com"
							autocomplete="email"
							required>

					</div>


					<div class="form-group">

						<label for="signup-password">
							رمز عبور
						</label>

						<div class="password-wrapper">

							<input
								type="password"
								id="signup-password"
								name="password"
								placeholder="رمز عبور خود را وارد کنید"
								autocomplete="new-password"
								required
								minlength="6">

							<button
								type="button"
								class="password-toggle"
								id="password-toggle"
								aria-label="نمایش رمز عبور">
								نمایش
							</button>

						</div>


						<div class="password-strength">

							<div class="password-strength-bar">

								<div
									id="password-strength-fill"
									class="password-strength-fill">
								</div>

							</div>


							<div
								id="password-strength-text"
								class="password-strength-text">
								حداقل ۶ کاراکتر
							</div>

						</div>

					</div>


					<div class="form-group">

						<label for="signup-avatar">

							تصویر پروفایل

							<span class="optional-label">
								(اختیاری)
							</span>

						</label>


						<div class="avatar-wrapper">

							<div
								id="avatar-placeholder"
								class="avatar-placeholder">
								T
							</div>


							<img
								id="avatar-preview"
								class="avatar-preview"
								alt="پیش‌نمایش تصویر پروفایل">


							<div class="avatar-info">

								<strong>
									انتخاب تصویر
								</strong>

								<span>
									تصویر پروفایل اختیاری است
								</span>

								<input
									type="file"
									id="signup-avatar"
									name="avatar"
									class="avatar-input"
									accept="image/*">

							</div>

						</div>

					</div>


					<div class="form-group full-width">

						<label for="address">

							آدرس

							<span class="optional-label">
								(اختیاری)
							</span>

						</label>

						<textarea
							id="address"
							name="address"
							placeholder="اگر مایل هستید آدرس خود را وارد کنید..."
							autocomplete="street-address"></textarea>

					</div>


					<div
						id="signup-message"
						class="signup-message">
					</div>


					<button
						type="submit"
						id="signup-btn"
						class="signup-submit">
						ایجاد حساب کاربری
					</button>

				</form>


				<div class="signup-footer">

					<p>

						قبلاً حساب کاربری ساخته‌اید؟

						<a href="login.html">
							ورود به حساب
						</a>

					</p>


					<a
						href="index.html"
						class="back-to-shop">
						بازگشت به فروشگاه
					</a>

				</div>

			</div>

		</div>

	</div>


	<script>
		const passwordInput =
			document.getElementById(
				"signup-password"
			);


		const passwordToggle =
			document.getElementById(
				"password-toggle"
			);


		const passwordStrengthFill =
			document.getElementById(
				"password-strength-fill"
			);


		const passwordStrengthText =
			document.getElementById(
				"password-strength-text"
			);


		passwordToggle.addEventListener(
			"click",
			function () {

				const isPassword =
					passwordInput.type ===
					"password";


				passwordInput.type =
					isPassword
						? "text"
						: "password";


				passwordToggle.textContent =
					isPassword
						? "مخفی"
						: "نمایش";

			}
		);


		passwordInput.addEventListener(
			"input",
			function () {

				const password =
					passwordInput.value;


				let strength = 0;


				if (password.length >= 6) {
					strength++;
				}


				if (password.length >= 8) {
					strength++;
				}


				if (/[A-Z]/.test(password)) {
					strength++;
				}


				if (/[0-9]/.test(password)) {
					strength++;
				}


				if (
					/[^A-Za-z0-9]/.test(password)
				) {
					strength++;
				}


				const widths = [
					"0%",
					"20%",
					"40%",
					"60%",
					"80%",
					"100%"
				];


				passwordStrengthFill.style.width =
					widths[strength];


				if (!password) {

					passwordStrengthText.textContent =
						"حداقل ۶ کاراکتر";

				} else if (strength <= 1) {

					passwordStrengthText.textContent =
						"رمز عبور ضعیف است";

				} else if (strength <= 3) {

					passwordStrengthText.textContent =
						"رمز عبور متوسط است";

				} else {

					passwordStrengthText.textContent =
						"رمز عبور قوی است";

				}

			}
		);


		const avatarInput =
			document.getElementById(
				"signup-avatar"
			);


		const avatarPreview =
			document.getElementById(
				"avatar-preview"
			);


		const avatarPlaceholder =
			document.getElementById(
				"avatar-placeholder"
			);


		avatarInput.addEventListener(
			"change",
			function () {

				const file =
					avatarInput.files[0];


				if (!file) {

					avatarPreview.style.display =
						"none";

					avatarPlaceholder.style.display =
						"flex";

					avatarPreview.removeAttribute(
						"src"
					);

					return;
				}


				if (
					!file.type.startsWith(
						"image/"
					)
				) {

					avatarInput.value = "";

					avatarPreview.style.display =
						"none";

					avatarPlaceholder.style.display =
						"flex";

					return;
				}


				const reader =
					new FileReader();


				reader.onload =
					function (event) {

						avatarPreview.src =
							event.target.result;

						avatarPreview.style.display =
							"block";

						avatarPlaceholder.style.display =
							"none";

					};


				reader.readAsDataURL(file);

			}
		);
	</script>


	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

	<script src="auth.js"></script>

</body>

</html>
