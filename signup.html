<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1">

<title>ثبت‌نام | T-Choob</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');

body{

font-family:'Vazirmatn',sans-serif;

}

</style>

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

<div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-lg">

<h1 class="text-3xl font-bold text-center mb-8">

ثبت‌نام

</h1>

<input

id="signup-username"

type="text"

placeholder="نام کاربری"

class="w-full border p-4 rounded-xl mb-4"

>

<input

id="signup-phone"

type="text"

placeholder="شماره موبایل"

class="w-full border p-4 rounded-xl mb-4"

>

<input

id="signup-avatar"

type="file"

accept="image/*"

class="w-full border p-4 rounded-xl mb-4"

>

<input

id="signup-email"

type="email"

placeholder="ایمیل"

class="w-full border p-4 rounded-xl mb-4"

>

<div class="relative mb-3">

<input

id="signup-password"

type="password"

placeholder="رمز عبور"

class="w-full border p-4 rounded-xl pl-14"

>

<button

type="button"

onclick="togglePassword()"

class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"

>

👁️

</button>

</div>

<div class="mb-6">

<div class="w-full bg-gray-200 h-2 rounded-full">

<div

id="password-bar"

class="h-2 rounded-full transition-all"

style="width:0%"

>

</div>

</div>

<p

id="password-strength"

class="text-sm mt-2 text-gray-500"

>

قدرت رمز عبور

</p>

</div>

<button

onclick="handleSignup()"

class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-xl font-bold transition"

>

ثبت‌نام

</button>

<a

href="./login.html"

class="block text-center text-blue-600 mt-6 hover:underline"

>

ورود

</a>

<a

href="./index.html"

class="block text-center mt-4 text-gray-600 hover:text-blue-600"

>

⬅️ بازگشت به فروشگاه

</a>

</div>

<script>

const passwordInput =

document.getElementById(

'signup-password'

);



passwordInput.addEventListener(

'input',

checkStrength

);



function togglePassword(){

passwordInput.type=

passwordInput.type==='password'

? 'text'

: 'password';

}



function checkStrength(){

const value =

passwordInput.value;



const bar =

document.getElementById(

'password-bar'

);



const text =

document.getElementById(

'password-strength'

);



let score = 0;



if(value.length>=8) score++;

if(/[A-Z]/.test(value)) score++;

if(/[0-9]/.test(value)) score++;

if(/[!@#$%^&*]/.test(value)) score++;



if(score===0){

bar.style.width='0%';

bar.className='h-2 rounded-full';

text.innerText='قدرت رمز عبور';

return;

}



if(score===1){

bar.style.width='25%';

bar.className='h-2 rounded-full bg-red-500';

text.innerText='ضعیف';

}



if(score===2){

bar.style.width='50%';

bar.className='h-2 rounded-full bg-orange-500';

text.innerText='متوسط';

}



if(score===3){

bar.style.width='75%';

bar.className='h-2 rounded-full bg-blue-500';

text.innerText='خوب';

}



if(score===4){

bar.style.width='100%';

bar.className='h-2 rounded-full bg-green-500';

text.innerText='قوی';

}

}

</script>

<script src="auth.js"></script>

</body>

</html>
