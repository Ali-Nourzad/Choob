<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ثبت‌نام | T-Choob</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-lg">

<h1 class="text-3xl font-bold text-center mb-8">

ثبت‌نام

</h1>

<input

id="signup-username"

type="text"

placeholder="نام کاربری"

class="w-full border p-4 rounded-xl mb-4">

<input

id="signup-phone"

type="text"

placeholder="شماره موبایل"

class="w-full border p-4 rounded-xl mb-4">

<input

id="signup-avatar"

type="file"

accept="image/*"

class="w-full border p-4 rounded-xl mb-4">

<input

id="signup-email"

type="email"

placeholder="ایمیل"

class="w-full border p-4 rounded-xl mb-4">

<input

id="signup-password"

type="password"

placeholder="رمز عبور"

class="w-full border p-4 rounded-xl mb-6">

<button

onclick="handleSignup()"

class="w-full bg-green-600 text-white py-4 rounded-xl">

ثبت‌نام

</button>

<a

href="./login.html"

class="block text-center text-blue-600 mt-6">

ورود

</a>
<a

href="./index.html"

class="block text-center mt-4 text-gray-600 hover:text-blue-600"

>

⬅️ بازگشت به فروشگاه

</a>

</div>

<script src="auth.js"></script>

</body>

</html>
