<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>جزئیات محصول | T-Choob</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="icon" href="favicon.ico">

</head>

<body class="bg-gray-100">

<!-- هدر -->

<header class="bg-white shadow sticky top-0 z-50">

<div class="max-w-7xl mx-auto p-4 flex justify-between items-center">

<a href="index.html"

class="text-2xl font-bold text-blue-600">

T-Choob

</a>

<div class="flex items-center gap-4">

<a

href="index.html"

class="text-gray-600 hover:text-blue-600"

>

⬅️ بازگشت

</a>

<button

onclick="addCurrentProductToCart()"

class="bg-blue-600 text-white px-5 py-2 rounded-xl"

>

🛒 افزودن به سبد خرید

</button>

</div>

</div>

</header>



<!-- صفحه -->

<div

class="max-w-7xl mx-auto p-6"

>

<div

id="product-container"

class="hidden grid lg:grid-cols-2 gap-12"

>

<!-- تصاویر -->

<div>

<div

class="bg-white rounded-3xl p-6 shadow"

>

<img

id="main-image"

class="w-full h-[500px] object-contain"

>

</div>

<div

id="thumbs"

class="flex gap-3 mt-4 overflow-x-auto"

>

</div>

</div>



<!-- اطلاعات -->

<div>

<div

class="bg-white rounded-3xl p-8 shadow"

>

<h1

id="product-name"

class="text-4xl font-bold mb-6"

>

</h1>

<p

id="product-price"

class="text-3xl text-blue-600 font-bold mb-8"

>

</p>

<p

id="product-description"

class="text-gray-600 leading-9"

>

</p>

<button

onclick="addCurrentProductToCart()"

class="w-full mt-10 bg-green-600 text-white py-4 rounded-2xl text-xl font-bold"

>

🛒 افزودن به سبد خرید

</button>

</div>

</div>

</div>



<!-- لودینگ -->

<div

id="loading"

class="text-center py-20"

>

در حال بارگذاری...

</div>



</div>



<script>

const SUPABASE_URL = 'https://rlduutynqgevgzmayeit.supabase.co';

const SUPABASE_KEY = 'sb_publishable_QQKsRmCxqZNX1dZW7bjAmA_xypPHAjD';

const shopDB =

window.supabase.createClient(

SUPABASE_URL,

SUPABASE_KEY

);



let currentProduct = null;



document.addEventListener(

'DOMContentLoaded',

loadProduct

);



async function loadProduct(){



const id =

new URLSearchParams(

window.location.search

).get('id');



if(!id){

return location.href='index.html';

}



const {

data,

error

} = await shopDB

.from('products')

.select('*')

.eq('id',id)

.single();



if(error || !data){

return location.href='index.html';

}



currentProduct = data;



document

.getElementById('loading')

.classList.add('hidden');



document

.getElementById('product-container')

.classList.remove('hidden');



document

.getElementById('product-name')

.innerText = data.name;



document

.getElementById('product-price')

.innerText =

`${Number(data.price)

.toLocaleString()} تومان`;



document

.getElementById('product-description')

.innerText =

data.description ||

'توضیحاتی ثبت نشده است.';



let images = [];



if(data.images){

images =

data.images

.split('|')

.filter(Boolean);

}



if(images.length===0){

images.push(

data.image_url

);

}



document

.getElementById('main-image')

.src = images[0];



document

.getElementById('thumbs')

.innerHTML =

images.map(img => `

<img

src="${img}"

onclick="changeImage('${img}')"

class="w-24 h-24 rounded-xl border cursor-pointer object-cover hover:scale-105 transition"

>

`).join('');

}



function changeImage(url){

document

.getElementById('main-image')

.src = url;

}



function addCurrentProductToCart(){



if(!currentProduct){

return;

}



let cart =

JSON.parse(

localStorage.getItem('cart')

) || [];



const item =

cart.find(

i => i.id == currentProduct.id

);



if(item){

item.quantity++;

}

else{

cart.push({

id: currentProduct.id,

quantity: 1

});

}



localStorage.setItem(

'cart',

JSON.stringify(cart)

);



alert(

'محصول به سبد خرید اضافه شد.'

);

}

</script>

</body>

</html>
