<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جزئیات محصول | T-Choob</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="product-types.js"></script>
    <script src="script.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <h1 class="logo" onclick="window.location.reload()">T-Choob</h1>
            <div class="navbar-actions">
                <button type="button" onclick="toggleCart()" class="cart-btn" aria-label="سبد خرید">
                    <img src="assets/cart-icons/cart.png" alt="" class="cart-icon">
                    <span id="cart-count">0</span>
                </button>
                <button
                    type="button"
                    id="shop-theme-toggle"
                    class="theme-toggle"
                    onclick="toggleShopTheme()"
                    aria-label="تغییر حالت نمایش"
                >
                    <span>حالت تاریک</span>
                </button>
                <a href="index.html" class="back-link">بازگشت</a>
            </div>
        </div>
    </nav>
    <main class="main-container product-page-main">
        <div id="product-container" class="product-container hidden">
            <section class="product-gallery-section">
                <div class="product-main-image-card">
                    <div class="product-main-image-box">
                        <img id="main-image" alt="تصویر محصول">
                    </div>
                </div>
                <div id="thumbs" class="product-thumbs"></div>
            </section>
            <section class="product-info-section">
                <div class="product-detail-card">
                    <h1 id="product-name"></h1>
                    <p id="product-price"></p>
                    <p id="product-description"></p>
                    <div id="product-details" class="product-details"></div>
                    <button onclick="addCurrentProductToCart()" class="product-btn">افزودن به سبد خرید</button>
                </div>
            </section>
        </div>
        <div id="loading" class="product-loading">در حال بارگذاری...</div>
    </main>
    <div id="cart-modal" class="cart-modal hidden">
        <div class="cart-panel">
            <div class="cart-header">
                <h2>سبد خرید</h2>
                <button type="button" onclick="toggleCart()" aria-label="بستن" class="cart-close-btn">
                    <img src="assets/cart-icons/close.png" alt="" class="cart-close-icon">
                </button>
            </div>
            <div id="cart-items-list" class="cart-items"></div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>جمع کل</span>
                    <span id="cart-total">۰ تومان</span>
                </div>
                <button type="button" onclick="checkout()">ثبت سفارش</button>
            </div>
        </div>
    </div>
    <script>
        let currentProduct = null;
        document.addEventListener("DOMContentLoaded", loadProduct);

        async function loadProduct() {
            const id = new URLSearchParams(window.location.search).get("id");

            if (!id) {
                location.href = "index.html";
                return;
            }

            const { data, error } = await shopDB
                .from("products")
                .select("*")
                .eq("id", id)
                .single();

            if (error || !data) {
                location.href = "index.html";
                return;
            }

            currentProduct = data;
            document.getElementById("loading").classList.add("hidden");
            document.getElementById("product-container").classList.remove("hidden");
            document.getElementById("product-name").innerText = data.name;
            document.getElementById("product-price").innerText = `${Number(data.price).toLocaleString()} تومان`;
            document.getElementById("product-description").innerText = data.description || "توضیحاتی ثبت نشده است.";
            renderProductDetails(data);

            let images = [];

            if (data.images) {
                images = data.images.split("|").filter(Boolean);
            }

            if (images.length === 0 && data.image_url) {
                images.push(data.image_url);
            }

            const mainImage = document.getElementById("main-image");

            if (images.length > 0) {
                mainImage.src = images[0];
            }

            document.getElementById("thumbs").innerHTML = images.map((img, index) => `
                <img
                    src="${escapeHTML(img)}"
                    data-image="${escapeHTML(img)}"
                    onclick="changeImage(this.dataset.image)"
                    alt="تصویر ${index + 1}"
                    class="product-thumb"
                    onerror="this.style.display='none'"
                >
            `).join("");
        }

        function renderProductDetails(product) {
            const container = document.getElementById("product-details");

            if (!container) {
                return;
            }

            const config = window.TCHOO_PRODUCT_TYPES?.[product.product_type];
            const details = product.details && typeof product.details === "object"
                ? product.details
                : {};

            if (!config || !Array.isArray(config.fields)) {
                container.innerHTML = "";
                return;
            }

            const rows = config.fields
                .map(field => ({
                    field,
                    value: details[field.key]
                }))
                .filter(item => item.value !== undefined && item.value !== null && String(item.value).trim() !== "")
                .map(({ field, value }) => `
                    <div class="product-detail-row">
                        <span class="product-detail-label">${escapeHTML(field.label)}</span>
                        <span class="product-detail-value">${escapeHTML(String(value))}</span>
                    </div>
                `)
                .join("");

            if (!rows) {
                container.innerHTML = "";
                return;
            }

            container.innerHTML = `
                <div class="product-details-card">
                    <h2>مشخصات محصول</h2>
                    <div class="product-detail-list">${rows}</div>
                </div>
            `;
        }

        function changeImage(url) {
            document.getElementById("main-image").src = url;
        }

        function addCurrentProductToCart() {
            if (!currentProduct) {
                return;
            }

            addToCart(currentProduct.id);
            alert("محصول به سبد خرید اضافه شد.");
        }

        updateCartCount();
    </script>

</body>
</html>
