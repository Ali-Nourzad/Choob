<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل | T-Choob</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <script src="product-types.js"></script>
    <script src="script.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <h1 onclick="window.location.reload()" class="logo">T-Choob</h1>
            <div class="navbar-actions">
                <button
                    type="button"
                    id="shop-theme-toggle"
                    class="theme-toggle"
                    onclick="toggleShopTheme()"
                    aria-label="تغییر حالت نمایش"
                >
                    <span>حالت تاریک</span>
                </button>
                <a href="index.html" class="back-link">بازگشت</a>
            </div>
        </div>
    </nav>
    <main class="profile-page">
        <div class="profile-card">
            <div class="profile-header">
                <button
                    type="button"
                    class="profile-avatar-button"
                    onclick="openProfileImage()"
                    aria-label="بزرگ کردن تصویر پروفایل"
                >
                    <img id="avatar" class="profile-avatar" src="" alt="تصویر پروفایل">
                </button>
                <h1 id="username" class="profile-username">...</h1>
                <p id="email" class="profile-info">...</p>
                <p id="phone" class="profile-info">...</p>
            </div>
            <section class="profile-section">
                <h2 class="profile-title">تنظیمات حساب</h2>
                <div class="profile-form">
                    <input id="edit-username" type="text" placeholder="نام کاربری" class="profile-input">
                    <input id="edit-phone" type="text" placeholder="شماره موبایل" class="profile-input">
                    <input id="edit-avatar" type="text" placeholder="لینک عکس پروفایل" class="profile-input">
                    <button onclick="sendResetPasswordEmail()" class="profile-btn password-btn">تغییر رمز عبور</button>
                    <button onclick="saveProfile()" class="profile-btn save-btn">ذخیره تغییرات</button>
                </div>
            </section>
            <section class="profile-section">
                <h2 class="profile-title">سفارش‌های من</h2>
                <div id="orders-list" class="orders-container">در حال بارگذاری...</div>
            </section>
            <section class="profile-section">
                <button onclick="handleLogout()" class="profile-btn logout-btn">خروج از حساب</button>
            </section>
        </div>
    </main>

    <div
        id="profile-image-viewer"
        class="profile-image-viewer hidden"
        role="dialog"
        aria-modal="true"
        aria-label="تصویر پروفایل"
        onclick="closeProfileImage(event)"
    >
        <button
            type="button"
            class="profile-image-viewer-close"
            onclick="closeProfileImage(event)"
            aria-label="بستن تصویر"
        >
            ×
        </button>
        <img
            id="profile-image-large"
            class="profile-image-large"
            src=""
            alt="تصویر پروفایل بزرگ"
            onclick="event.stopPropagation()"
        >
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadProfile);

        async function loadProfile() {
            const { data: { user } } = await shopDB.auth.getUser();

            if (!user) {
                location.href = "login.html";
                return;
            }

            currentUser = user;
            document.getElementById("email").innerText = user.email || "";

            const { data: profile } = await shopDB
                .from("profiles")
                .select("*")
                .eq("id", user.id)
                .single();

            if (!profile) {
                alert("پروفایل پیدا نشد");
                return;
            }

            document.getElementById("avatar").src = profile.avatar_url || "assets/avatar.png";
            document.getElementById("username").innerText = profile.username || "";
            document.getElementById("phone").innerText = profile.phone || "";
            document.getElementById("edit-username").value = profile.username || "";
            document.getElementById("edit-phone").value = profile.phone || "";
            document.getElementById("edit-avatar").value = profile.avatar_url || "";
        }

        function openProfileImage() {
            const avatar = document.getElementById("avatar");
            const viewer = document.getElementById("profile-image-viewer");
            const largeImage = document.getElementById("profile-image-large");

            if (!avatar || !viewer || !largeImage || !avatar.src) {
                return;
            }

            largeImage.src = avatar.src;
            viewer.classList.remove("hidden");
            document.body.classList.add("profile-image-viewer-open");
        }

        function closeProfileImage(event) {
            if (event && event.target !== event.currentTarget && event.target.id !== "profile-image-viewer") {
                return;
            }

            const viewer = document.getElementById("profile-image-viewer");

            if (!viewer) {
                return;
            }

            viewer.classList.add("hidden");
            document.body.classList.remove("profile-image-viewer-open");
        }

        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                closeProfileImage();
            }
        });

        async function saveProfile() {
            const username = document.getElementById("edit-username").value.trim();
            const phone = document.getElementById("edit-phone").value.trim();
            const avatar_url = document.getElementById("edit-avatar").value.trim();

            const { error } = await shopDB
                .from("profiles")
                .update({ username, phone, avatar_url })
                .eq("id", currentUser.id);

            if (error) {
                alert("خطا در ذخیره اطلاعات");
                return;
            }

            alert("ذخیره شد");
            loadProfile();
        }
    </script>
</body>
</html>
