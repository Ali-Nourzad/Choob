<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>پروفایل | T-Choob</title>

	<link rel="icon" href="favicon.ico">
	<link rel="stylesheet" href="style.css">

	<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

	<nav class="navbar">

		<div class="navbar-container">

			<h1
				onclick="window.location.reload()"
				class="logo">
				T-Choob
			</h1>

			<a
				href="index.html"
				class="back-link">
				بازگشت
			</a>

		</div>

	</nav>


	<main class="profile-page">

		<div class="profile-card">

			<div class="profile-header">

				<img
					id="avatar"
					class="profile-avatar"
					src=""
					alt="تصویر پروفایل">

				<h1
					id="username"
					class="profile-username">
					...
				</h1>

				<p
					id="email"
					class="profile-info">
					...
				</p>

				<p
					id="phone"
					class="profile-info">
					...
				</p>

			</div>


			<section class="profile-section">

				<h2 class="profile-title">
					تنظیمات حساب
				</h2>

				<div class="profile-form">

					<input
						id="edit-username"
						type="text"
						placeholder="نام کاربری"
						class="profile-input">

					<input
						id="edit-phone"
						type="text"
						placeholder="شماره موبایل"
						class="profile-input">

					<input
						id="edit-avatar"
						type="text"
						placeholder="لینک عکس پروفایل"
						class="profile-input">

					<button
						onclick="sendResetPasswordEmail()"
						class="profile-btn password-btn">
						تغییر رمز عبور
					</button>

					<button
						onclick="saveProfile()"
						class="profile-btn save-btn">
						ذخیره تغییرات
					</button>

				</div>

			</section>


			<section class="profile-section">
			
				<h2 class="profile-title">
					سفارش‌های من
				</h2>
			
				<div
					id="orders-list"
					class="orders-container">
					در حال بارگذاری...
				</div>
			
			</section>
			
			
			<!-- =========================================
			     IMAGE MODAL
			========================================= -->
			
			<div
				id="image-modal"
				class="image-modal"
				onclick="closeImageModal()">
			
				<div
					class="image-modal-content"
					onclick="event.stopPropagation()">
			
					<button
						type="button"
						class="image-modal-close"
						onclick="closeImageModal()">
						×
					</button>
			
					<img
						id="image-modal-img"
						src=""
						alt="تصویر سفارش">
			
				</div>
			
			</div>


			<section class="profile-section">

				<button
					onclick="handleLogout()"
					class="profile-btn logout-btn">
					خروج از حساب
				</button>

			</section>

		</div>

	</main>


	<!-- =========================================
	     ORDER IMAGE MODAL
	========================================= -->

	<div
		id="order-image-modal"
		class="order-image-modal"
		aria-hidden="true">

		<button
			id="order-image-modal-close"
			class="order-image-modal-close"
			type="button"
			aria-label="بستن">
			×
		</button>

		<img
			id="order-image-modal-img"
			src=""
			alt="تصویر بزرگ سفارش">

	</div>


	<script src="script.js"></script>


	<script>

		document.addEventListener(
			"DOMContentLoaded",
			loadProfile
		);


		/* =========================================
		   PROFILE
		========================================= */

		async function loadProfile() {

			const {
				data: {
					user
				}
			} = await shopDB.auth.getUser();


			if (!user) {

				location.href = "login.html";

				return;

			}


			currentUser = user;


			document.getElementById(
				"email"
			).innerText =
				user.email || "";


			const {
				data: profile
			} = await shopDB
				.from("profiles")
				.select("*")
				.eq("id", user.id)
				.single();


			if (!profile) {

				alert(
					"پروفایل پیدا نشد"
				);

				return;

			}


			document.getElementById(
				"avatar"
			).src =
				profile.avatar_url ||
				"assets/avatar.png";


			document.getElementById(
				"username"
			).innerText =
				profile.username || "";


			document.getElementById(
				"phone"
			).innerText =
				profile.phone || "";


			document.getElementById(
				"edit-username"
			).value =
				profile.username || "";


			document.getElementById(
				"edit-phone"
			).value =
				profile.phone || "";


			document.getElementById(
				"edit-avatar"
			).value =
				profile.avatar_url || "";

		}


		/* =========================================
		   SAVE PROFILE
		========================================= */

		async function saveProfile() {

			if (!currentUser) {
				return;
			}


			const username =
				document.getElementById(
					"edit-username"
				).value.trim();


			const phone =
				document.getElementById(
					"edit-phone"
				).value.trim();


			const avatar_url =
				document.getElementById(
					"edit-avatar"
				).value.trim();


			const {
				error
			} = await shopDB
				.from("profiles")
				.update({
					username,
					phone,
					avatar_url
				})
				.eq(
					"id",
					currentUser.id
				);


			if (error) {

				alert(
					"خطا در ذخیره اطلاعات"
				);

				return;

			}


			alert(
				"اطلاعات با موفقیت ذخیره شد."
			);


			loadProfile();

		}


		/* =========================================
		   ORDER IMAGE LIGHTBOX
		========================================= */

		const orderImageModal =
			document.getElementById(
				"order-image-modal"
			);


		const orderImageModalImg =
			document.getElementById(
				"order-image-modal-img"
			);


		const orderImageModalClose =
			document.getElementById(
				"order-image-modal-close"
			);


		/*
		 * کلیک روی عکس سفارش
		 *
		 * از event delegation استفاده شده
		 * تا عکس‌هایی که بعداً توسط script.js
		 * ساخته می‌شوند هم کار کنند.
		 */

		document.addEventListener(
			"click",
			function (event) {

				const imageBox =
					event.target.closest(
						".order-card-image"
					);


				if (!imageBox) {
					return;
				}


				const image =
					imageBox.querySelector(
						"img"
					);


				if (!image) {
					return;
				}


				const imageSource =
					image.currentSrc ||
					image.src;


				if (!imageSource) {
					return;
				}


				orderImageModalImg.src =
					imageSource;


				orderImageModalImg.alt =
					image.alt ||
					"تصویر سفارش";


				orderImageModal.classList.add(
					"active"
				);


				orderImageModal.setAttribute(
					"aria-hidden",
					"false"
				);


				document.body.style.overflow =
					"hidden";

			}
		);


		/* =========================================
		   CLOSE IMAGE
		========================================= */

		function closeOrderImage() {

			orderImageModal.classList.remove(
				"active"
			);


			orderImageModal.setAttribute(
				"aria-hidden",
				"true"
			);


			document.body.style.overflow =
				"";


			setTimeout(
				function () {

					if (
						!orderImageModal.classList.contains(
							"active"
						)
					) {

						orderImageModalImg.src =
							"";

					}

				},
				250
			);

		}


		orderImageModalClose.addEventListener(
			"click",
			closeOrderImage
		);


		/*
		 * کلیک روی فضای تاریک اطراف عکس
		 */

		orderImageModal.addEventListener(
			"click",
			function (event) {

				if (
					event.target ===
					orderImageModal
				) {

					closeOrderImage();

				}

			}
		);


		/*
		 * بستن با کلید Escape
		 */

		document.addEventListener(
			"keydown",
			function (event) {

				if (
					event.key === "Escape" &&
					orderImageModal.classList.contains(
						"active"
					)
				) {

					closeOrderImage();

				}

			}
		);

	</script>

</body>

</html>
