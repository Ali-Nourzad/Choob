<!DOCTYPE html>

<html lang="fa" dir="rtl">
  
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>T-Choob</title>

<link rel="icon" href="favicon.ico">

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<!-- ناوبار -->

<nav class="navbar">

<div class="navbar-container">

<h1 class="logo" onclick="window.location.reload()">

T-Choob

</h1>

<div class="navbar-actions">

<button onclick="toggleCart()" class="cart-btn">

🛒

<span id="cart-count">0</span>

</button>

<div id="user-section"></div>

</div>

</div>

</nav>


<!-- بنر -->

<section class="hero">

<div class="hero-overlay">

<div class="hero-text">

<h1>چوب گالری</h1>

<p>T-Choob</p>

</div>

</div>

</section>


<!-- سرچ و فیلتر -->

<section class="search-section">

<input

type="text"

placeholder="جستجو ..."

id="search-input"

oninput="filterProducts()"

>

<select

id="sort-select"

onchange="filterProducts()"

>

<option value="">

مرتب سازی ...

</option>

<option value="cheap">

ارزان‌ترین

</option>

<option value="expensive">

گران‌ترین

</option>

<option value="name">

الفبا

</option>

</select>

</section>


<!-- محصولات -->

<main class="main-container">

<header class="products-header">

<h2>محصولات برتر ما</h2>

<p>کیفیت تضمین شده برای شما</p>

</header>


<div id="product-grid" class="products-grid">

<h2>در حال بارگذاری...</h2>

</div>

</main>


<!-- سبد خرید -->

<div id="cart-modal" class="cart-modal hidden">

<div class="cart-panel">

<div class="cart-header">

<h2>سبد خرید</h2>

<button onclick="toggleCart()">

×

</button>

</div>


<div id="cart-items-list" class="cart-items">

<h2>nothing</h2>

</div>


<div class="cart-footer">

<div class="cart-total">

<span>جمع کل</span>

<span id="cart-total">

۰ تومان

</span>

</div>

<button onclick="checkout()">

ثبت سفارش

</button>

</div>

</div>

</div>


<script src="script.js"></script>


<script>
const fuse = new Fuse(products, {

  keys: [
    'name',
    'description',
    'category'
  ],

  threshold: 0.4

});

function searchProducts(search){

  if(!search){

    return products;

  }

  return fuse
    .search(search)
    .map(item => item.item);

}



function sortProducts(){

const value =

document.getElementById(

'sort-select'

).value;


let sorted = [...products];


if(value==="cheap"){

sorted.sort(

(a,b)=>a.price-b.price

);

}


if(value==="expensive"){

sorted.sort(

(a,b)=>b.price-a.price

);

}


if(value==="name"){

sorted.sort(

(a,b)=>

a.name.localeCompare(

b.name,

'fa'

)

);

}


renderProducts(sorted);

}

</script>

</body>

</html>
