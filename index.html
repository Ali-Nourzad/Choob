<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>T-Choob</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="bg-gray-100">

<nav class="bg-white shadow p-4">

<div class="container mx-auto flex justify-between items-center">

<h1 class="text-2xl font-bold text-blue-600">

T-Choob

</h1>
<div class="gap-4">

  <button

  onclick="toggleCart()"

  class="relative p-3 bg-blue-50 rounded-full hover:bg-blue-100 transition"

  >

    🛒

    <span

    id="cart-count"

    class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center"

    >

      0

    </span>

  </button>

  <div id="user-section"></div>

</div>
<div id="user-section"></div>

</div>

</nav>

<main class="container mx-auto p-6">

<h2 class="text-3xl font-bold mb-8">

محصولات

</h2>

<div
onclick="goToProduct('${p.id}')"
class="cursor-pointer"
id="product-grid"

<h2 class="text-2xl mb-8">
در حال بارگذاری ...
</h2>

</div>

</main>
<div

id="cart-modal"

class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end"

>

<div

class="bg-white w-full max-w-md h-full shadow-2xl p-6 flex flex-col"

>

<div class="flex justify-between items-center mb-6">

<h2 class="text-xl font-bold">

سبد خرید

</h2>

<button

onclick="toggleCart()"

class="text-3xl"

>

&times;

</button>

</div>

<div

id="cart-items-list"

class="flex-1 overflow-y-auto"

>

</div>

<div class="border-t pt-4">

<div

class="flex justify-between text-lg font-bold mb-4"

>

<span>

جمع کل

</span>

<span id="cart-total">

۰ تومان

</span>

</div>

<button

onclick="checkout()"

class="w-full bg-green-600 text-white py-4 rounded-xl"

>

ثبت سفارش

</button>

</div>

</div>

</div>
<div

id="cart-box"

class="fixed bottom-6 left-6 bg-white p-5 rounded-2xl shadow-lg">

<div class="font-bold mb-2">

سبد خرید

</div>
<button onclick="toggleCart()">
<div id="cart-count">

0

</div>

</div>

<script src="script.js"></script>

</body>

</html>
