<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Choob</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; scroll-behavior: smooth; }
        .product-card:hover img { transform: scale(1.05); }
        #cart-modal, #product-detail-page, #auth-modal { transition: all 0.3s ease-in-out; }
        /* پنهان کردن اسکرول‌بار برای تصاویر کوچک */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- نوار ناوبری (Navbar) -->
    <nav class="bg-white shadow-md sticky top-0 z-40 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-600 cursor-pointer" onclick="window.location.reload()">T-Choob</h1>
            
            <div class="flex items-center gap-4">
                <!-- پروفایل/ورود -->
                <div id="user-section">
                    <button onclick="openAuthModal()" class="text-gray-600 hover:text-blue-600 font-medium">ورود / ثبت نام</button>
                </div>

                <!-- سبد خرید -->
                <button onclick="toggleCart()" class="relative p-2 bg-blue-50 rounded-full">
                    <span class="text-xl">🛒</span>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- بخش اصلی محصولات -->
    <main class="container mx-auto p-6">
        <header class="text-center my-10">
            <h2 class="text-3xl font-bold text-gray-800">محصولات برتر ما</h2>
            <p class="text-gray-500 mt-2">کیفیت تضمین شده برای شما</p>
        </header>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- محصولات توسط JS اینجا ساخته می‌شوند -->
        </div>
    </main>

    <!-- [MODAL] سبد خرید -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl p-6 flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">سبد خرید شما</h2>
                <button onclick="toggleCart()" class="text-2xl">&times;</button>
            </div>
            <div id="cart-items-list" class="flex-1 overflow-y-auto space-y-4"></div>
            <div class="border-t pt-4 mt-4">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>جمع کل:</span>
                    <span id="cart-total">۰ تومان</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold">ثبت نهایی سفارش</button>
            </div>
        </div>
    </div>

    <!-- [PAGE] جزئیات محصول (Product Detail Page) -->
    <div id="product-detail-page" class="fixed inset-0 bg-white z-50 hidden overflow-y-auto">
        <button onclick="closeProductPage()" class="fixed top-6 right-6 bg-gray-100 p-3 rounded-full shadow-md z-50 hover:bg-gray-200">🔙 بازگشت</button>
        
        <div class="container mx-auto p-6 pt-20">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <!-- تصاویر -->
                <div class="space-y-4">
                    <div class="aspect-square bg-gray-100 rounded-2xl flex items-center justify-center overflow-hidden">
                        <img id="main-product-img" src="" class="max-h-full object-contain transition-all duration-500">
                    </div>
                    <div id="product-image-thumbnails" class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
                        <!-- Thumbnails -->
                    </div>
                </div>
                <!-- اطلاعات -->
                <div class="space-y-6">
                    <h1 id="detail-title" class="text-4xl font-bold text-gray-800">نام محصول</h1>
                    <p id="detail-price" class="text-3xl text-blue-600 font-bold">۰ تومان</p>
                    <p id="detail-description" class="text-gray-600 text-lg leading-relaxed">توضیحات...</p>
                    <button id="detail-add-to-cart" class="w-full bg-blue-600 text-white py-4 rounded-2xl text-xl font-bold hover:bg-blue-700 shadow-lg">افزودن به سبد خرید</button>
                </div>
            </div>

            <!-- بخش نظرات -->
            <div class="mt-20 max-w-3xl mx-auto border-t pt-10">
                <h3 class="text-2xl font-bold mb-6">نظرات مشتریان</h3>
                <div id="review-form-container" class="bg-gray-50 p-6 rounded-2xl mb-10">
                    <textarea id="review-text" class="w-full p-4 border rounded-xl h-32 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="نظر خود را بنویسید..."></textarea>
                    <button onclick="submitReview()" class="mt-4 bg-blue-600 text-white px-10 py-2 rounded-lg">ارسال نظر</button>
                </div>
                <div id="reviews-list" class="space-y-6"></div>
            </div>
        </div>
    </div>

    <!-- [MODAL] ورود و ثبت‌نام -->
    <div id="auth-modal" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl relative">
            <button onclick="toggleAuthModal()" class="absolute top-4 left-4 text-2xl text-gray-400">&times;</button>
            <div id="auth-content">
                <h2 class="text-2xl font-bold text-center mb-8">ورود به حساب</h2>
                <input type="email" id="login-email" placeholder="ایمیل" class="w-full p-4 mb-4 border rounded-xl outline-none focus:border-blue-500">
                <input type="password" id="login-password" placeholder="رمز عبور" class="w-full p-4 mb-6 border rounded-xl outline-none focus:border-blue-500">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg">ورود</button>
                <button onclick="handleSignup()"class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg">ثبت‌نام</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
